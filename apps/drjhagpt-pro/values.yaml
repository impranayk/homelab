# DrJhaGPT Pro on the lab. Phase 1: image from the k3d registry, secrets from bootstrap/20-secrets.sh.
# Phase 2: image from Gitea (gitea.127.0.0.1.sslip.io/homelab/drjhagpt-pro:<sha>), tag bumped by Renovate.
# Phase 5: point the app at LiteLLM instead of Groq (env below).
image:
  repository: homelab-registry:5000/drjhagpt-pro
  tag: dev
host: drjhagpt.127.0.0.1.sslip.io
envFromSecret: drjhagpt-pro-env
env:
  APP_ENV: homelab
  # OPENAI_BASE_URL: http://litellm.ai.svc:4000/v1     # phase 5
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 1Gi }
