# Phase 2 CI for an APP repository (copy this file into drjhagpt-enterprise/.gitea/workflows/).
# Gitleaks -> build -> Trivy -> push to the cluster registry (homelab-registry:5000, the k3d one the
# nodes already pull from). Inside the runner, gitea.127.0.0.1.sslip.io would resolve to the runner
# itself, so the Gitea registry is not reachable from CI until Harbor arrives in phase 4.
name: build
on:
  push:
    branches: [main]
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: homelab-registry:5000/drjhagpt-pro
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks (no secrets in git)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --exit-code 1

      - name: Build
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Trivy (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE:${GITHUB_SHA::7}"

      - name: Push
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          echo "deployed tag: ${GITHUB_SHA::7}  ->  set image.tag in homelab/apps/drjhagpt-pro/values.yaml"
