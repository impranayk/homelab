# Phase 2 CI for an APP repository (copy this file into drjhagpt-enterprise/.gitea/workflows/).
# Build -> Gitleaks -> Trivy -> push to the Gitea registry. Renovate then bumps the tag in homelab.
name: build
on:
  push:
    branches: [main]
jobs:
  image:
    runs-on: ubuntu-latest
    env:
      REGISTRY: gitea.127.0.0.1.sslip.io
      IMAGE: gitea.127.0.0.1.sslip.io/homelab/drjhagpt-pro
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks (no secrets in git)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --exit-code 1

      - name: Build
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Trivy (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE:${GITHUB_SHA::7}"

      - name: Push
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
