# Webhook lockout on the first attempt: Kyverno registered its webhooks while its own pod was still
# initialising and every API call waited on them. Ignore = the API proceeds if Kyverno cannot answer.
config:
  webhooks:
    failurePolicy: Ignore
admissionController:
  replicas: 1
  container:
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
backgroundController:
  resources: { requests: { cpu: 20m, memory: 64Mi } }
cleanupController:
  resources: { requests: { cpu: 20m, memory: 64Mi } }
reportsController:
  resources: { requests: { cpu: 20m, memory: 64Mi } }
