# OpenBao in dev mode is NOT what we want, even on a laptop: run it "for real" with file storage,
# so you learn init / unseal / policies. After first sync:
#   kubectl -n openbao exec -it openbao-0 -- bao operator init   (keep the keys in your password manager)
#   kubectl -n openbao exec -it openbao-0 -- bao operator unseal  (x3)
server:
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address = "[::]:8200"
        tls_disable = 1
      }
      storage "file" {
        path = "/openbao/data"
      }
  dataStorage:
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts: [{ host: openbao.127.0.0.1.sslip.io }]
    tls: [{ secretName: openbao-tls, hosts: [openbao.127.0.0.1.sslip.io] }]
ui:
  enabled: true
injector:
  enabled: false                  # External Secrets Operator is the integration path
