# Keycloak (codecentric keycloakx). Realm "homelab" is created by hand the first time;
# export it afterwards to platform/phase-4-secure/keycloak/extras/realm-homelab.json.
command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --http-enabled=true
  - --hostname-strict=false
  - --proxy-headers=xforwarded
extraEnv: |
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef: { name: keycloak-admin, key: password }
  - name: KC_HOSTNAME
    value: https://keycloak.127.0.0.1.sslip.io
  - name: JAVA_OPTS_APPEND
    value: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m   # start-up alone hit 1.2 cores / 527Mi on the first attempt
database:
  vendor: dev-file               # phase 5: switch to postgres on CloudNativePG
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
  rules:
    - host: keycloak.127.0.0.1.sslip.io
      paths: [{ path: /, pathType: Prefix }]
  tls: [{ secretName: keycloak-tls, hosts: [keycloak.127.0.0.1.sslip.io] }]
resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 640Mi }
