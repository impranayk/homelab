# Langfuse v3 needs Postgres + ClickHouse + Redis + S3. On the laptop the chart's bundled
# ClickHouse/Redis are used; Postgres and S3 come from this namespace.
langfuse:
  nextauth:
    url: https://langfuse.127.0.0.1.sslip.io
    secret: { secretKeyRef: { name: langfuse-secrets, key: nextauth-secret } }
  salt: { secretKeyRef: { name: langfuse-secrets, key: salt } }
  encryptionKey: { secretKeyRef: { name: langfuse-secrets, key: encryption-key } }
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts:
      - host: langfuse.127.0.0.1.sslip.io
        paths: [{ path: /, pathType: Prefix }]
    tls: [{ secretName: langfuse-tls, hosts: [langfuse.127.0.0.1.sslip.io] }]
  web:
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }
  worker:
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }
postgresql:
  deploy: false
  host: postgres-rw.ai.svc
  auth:
    username: app
    database: langfuse
    existingSecret: postgres-app
    secretKeys: { userPasswordKey: password }
clickhouse:
  deploy: true
  replicaCount: 1
  auth: { existingSecret: langfuse-secrets, existingSecretKey: clickhouse-password }
  resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1Gi } }
redis:
  deploy: true
  auth: { existingSecret: langfuse-secrets, existingSecretPasswordKey: redis-password }
s3:
  deploy: false
  endpoint: http://minio.ai.svc:9000
  forcePathStyle: true
  bucket: langfuse
  accessKeyId: { secretKeyRef: { name: minio-root, key: rootUser } }
  secretAccessKey: { secretKeyRef: { name: minio-root, key: rootPassword } }
