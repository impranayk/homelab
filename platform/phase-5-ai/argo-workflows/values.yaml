controller:
  workflowNamespaces: [ai]
  resources: { requests: { cpu: 20m, memory: 64Mi } }
server:
  authModes: [server]
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts: [workflows.127.0.0.1.sslip.io]
    tls: [{ secretName: workflows-tls, hosts: [workflows.127.0.0.1.sslip.io] }]
  resources: { requests: { cpu: 20m, memory: 64Mi } }
