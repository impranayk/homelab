# Gitea: git hosting + container registry (+ Actions runner via the separate gitea-runner component).
# Laptop mode: one replica, SQLite + in-memory cache. No Bitnami Postgres/Valkey (their old image
# tags are no longer served). Phase 5 exercise: move it onto the CloudNativePG cluster.
replicaCount: 1
strategy:
  type: Recreate                 # SQLite on one PVC: never two pods at once
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
    nginx.ingress.kubernetes.io/proxy-body-size: "0"   # image pushes to the registry
  hosts:
    - host: gitea.127.0.0.1.sslip.io
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - secretName: gitea-tls
      hosts: [gitea.127.0.0.1.sslip.io]
gitea:
  admin:
    existingSecret: gitea-admin  # keys: username, password  (bootstrap/20-secrets.sh)
    email: homelab@example.invalid
  config:
    server:
      ROOT_URL: https://gitea.127.0.0.1.sslip.io/
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: false
    packages:
      ENABLED: true              # this is the container registry
    actions:
      ENABLED: true
    service:
      DISABLE_REGISTRATION: true
postgresql-ha: { enabled: false }
postgresql: { enabled: false }
valkey-cluster: { enabled: false }
valkey: { enabled: false }
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 768Mi }
persistence:
  enabled: true
  size: 10Gi
