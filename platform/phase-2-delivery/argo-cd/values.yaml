# Used twice: by bootstrap/10-argocd.sh (helm install) and, from phase 2, by Argo CD itself.
global:
  domain: argocd.127.0.0.1.sslip.io
configs:
  params:
    server.insecure: true          # TLS terminates at ingress-nginx
  cm:
    timeout.reconciliation: 180s
    kustomize.buildOptions: --enable-helm
    # phase 4: Keycloak SSO
    # oidc.config: |
    #   name: Keycloak
    #   issuer: https://keycloak.127.0.0.1.sslip.io/realms/homelab
    #   clientID: argocd
    #   clientSecret: $oidc.keycloak.clientSecret
    #   requestedScopes: [openid, profile, email, groups]
  rbac:
    policy.default: role:readonly
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    tls: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
controller:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
applicationSet:
  enabled: false                   # the app-of-apps chart does this job
notifications:
  enabled: false
dex:
  enabled: false                   # Keycloak instead (phase 4)
redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
