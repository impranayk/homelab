opencost:
  prometheus:
    internal:
      enabled: true
      serviceName: kube-prometheus-stack-prometheus
      namespaceName: monitoring
      port: 9090
  exporter:
    defaultClusterId: homelab
    resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
    # pretend prices so the numbers mean something: roughly an m5.xlarge on-demand
    extraEnv:
      CPU: "0.048"
      RAM: "0.006"
  ui:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
      hosts: [{ host: opencost.127.0.0.1.sslip.io, paths: [/] }]
      tls: [{ secretName: opencost-tls, hosts: [opencost.127.0.0.1.sslip.io] }]
