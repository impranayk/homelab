controller:
  replicas: 1
  resources: { requests: { cpu: 20m, memory: 64Mi } }
dashboard:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts: [rollouts.127.0.0.1.sslip.io]
    tls: [{ secretName: rollouts-tls, hosts: [rollouts.127.0.0.1.sslip.io] }]
